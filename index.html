<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gas</title>
    <!-- Load Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #000 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #00f2ff; margin-bottom: 10px; font-size: 24px; }
        .subtitle { color: #a0aec0; margin-bottom: 30px; font-size: 14px; }
        
        .shifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-shift {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-shift:active { background: #00f2ff; color: #000; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; color: #a0aec0; font-size: 13px; margin-bottom: 5px; font-weight: 600; }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #00f2ff; }
        
        .buttons { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-primary {
            background: linear-gradient(90deg, #00f2ff, #d946ef);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .results { margin-top: 30px; display: none; }
        .results.show { display: block; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card {
            background: rgba(20,20,30,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-label { font-size: 11px; color: #a0aec0; margin-bottom: 5px; }
        .stat-value { font-size: 22px; font-weight: 800; color: #00f2ff; }
        
        .table-container {
            background: rgba(20,20,30,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.05); padding: 12px; text-align: left; font-size: 12px; color: #a0aec0; }
        td { padding: 12px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        
        .history { margin-top: 20px; }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-clear { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        
        .log {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 2px solid #0f0;
        }
        .log-close {
            position: absolute;
            top: 5px;
            right: 10px;
            background: #f00;
            color: #fff;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
        .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .status.success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
        .status.warning { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #f59e0b; }
        
        .charts { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        @media (min-width: 768px) { .charts { grid-template-columns: repeat(2, 1fr); } }
        .chart-wrapper {
            background: rgba(20,20,30,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
        }
        
        .log-panel {
            background: rgba(20,20,30,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .log-title { color: #00f2ff; font-size: 14px; font-weight: 600; }
        .log-content {
            font-family: monospace;
            font-size: 11px;
            color: #0f0;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .log-entry:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Kalkulator Gas</h1>
        <p class="subtitle">With Database Support</p>
        
        <div id="dbStatus"></div>
        
        <div class="shifts">
            <button class="btn-shift" onclick="setShift('07:00','15:00')">🌅 Pagi</button>
            <button class="btn-shift" onclick="setShift('15:00','23:00')">☀️ Sore</button>
            <button class="btn-shift" onclick="setShift('23:00','07:00')">🌙 Malam</button>
        </div>
        
        <form id="calcForm">
            <div class="form-group">
                <label>Angka Meter Gas Awal (m³)</label>
                <input type="number" id="meterStart" step="any" required>
            </div>
            <div class="form-group">
                <label>Waktu Awal</label>
                <input type="time" id="timeStart" required>
            </div>
            <div class="form-group">
                <label>Angka Meter Gas Akhir (m³)</label>
                <input type="number" id="meterEnd" step="any" required>
            </div>
            <div class="form-group">
                <label>Waktu Akhir</label>
                <input type="time" id="timeEnd" required>
            </div>
            <div class="buttons">
                <button type="submit" class="btn-primary">🔥 Hitung & Simpan</button>
                <button type="button" class="btn-secondary" onclick="resetForm()">Reset</button>
            </div>
        </form>
        
        <div class="results" id="results">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value"><span id="resTotal">0</span> m³</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Durasi</div>
                    <div class="stat-value"><span id="resDuration">0</span> Jam</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Rata-rata</div>
                    <div class="stat-value"><span id="resAvg">0</span> m³/jam</div>
                </div>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Jam</th><th>Meter</th><th>Pakai/jam</th><th>Kumulatif</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        
        <div class="history" id="history" style="display:none;">
            <div class="history-header">
                <h2 style="color: #00f2ff;">Riwayat Shift</h2>
                <button class="btn-clear" onclick="clearHistory()">Hapus</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Waktu</th><th>Rentang</th><th>Total</th></tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
        
        <div class="charts" id="charts" style="display:none;">
            <div class="chart-wrapper">
                <h3 style="color:#00f2ff;margin-bottom:10px;">📈 Tren 7 Hari Terakhir</h3>
                <canvas id="trendChart" height="80"></canvas>
            </div>
            <div class="chart-wrapper">
                <h3 style="color:#00f2ff;margin-bottom:10px;">📊 Per Shift</h3>
                <canvas id="shiftChart" height="80"></canvas>
            </div>
        </div>
    </div>
    
    <div class="log-panel" id="logPanel">
        <div class="log-header">
            <span class="log-title">📋 Log Aktivitas</span>
            <button class="btn-secondary" onclick="toggleLog()" style="padding: 4px 12px; font-size: 12px;">Tutup</button>
        </div>
        <div class="log-content" id="logContent"></div>
    </div>
    
    <script src="script.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pemakaian Meter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Dashboard Pemakaian Meter</h1>
        
        <div class="card">
            <form id="meterForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Angka Meter Awal</label>
                        <input type="number" id="meterStart" step="any" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label>Waktu Awal</label>
                        <input type="time" id="timeStart" required>
                    </div>
                    <div class="form-group">
                        <label>Angka Meter Akhir</label>
                        <input type="number" id="meterEnd" step="any" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label>Waktu Akhir</label>
                        <input type="time" id="timeEnd" required>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary">Hitung</button>
                    <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
                </div>
            </form>
        </div>

        <div id="resultsArea" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card">Total Pemakaian: <span id="resTotal"></span></div>
                <div class="stat-card">Durasi: <span id="resDuration"></span> Jam</div>
                <div class="stat-card">Rata-rata: <span id="resAvg"></span>/jam</div>
            </div>
            
            <div class="card">
                <h2>Grafik Pemakaian</h2>
                <canvas id="usageChart"></canvas>
            </div>

            <div class="card">
                <div class="table-actions">
                    <h2>Tabel Perkembangan</h2>
                    <button id="downloadBtn" class="btn-export">Download CSV</button>
                </div>
                <div class="table-container">
                    <table id="resultTable">
                        <thead>
                            <tr>
                                <th>Jam</th>
                                <th>Angka Meter</th>
                                <th>Pemakaian Jam</th>
                                <th>Kumulatif</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Calc Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <button onclick="showTab('calculator')">Kalkulator</button>
        <button onclick="showTab('history')">Riwayat</button>
        <button onclick="showTab('chart')">Grafik</button>
    </nav>

    <main>
        <section id="calculator" class="tab-content">
            <h2>Kalkulator</h2>
            <form id="calcForm">
                <input type="time" id="startTime" required>
                <input type="time" id="endTime" required>
                <input type="number" id="fuelStart" placeholder="Bahan Bakar Awal (L)" step="0.01" required>
                <input type="number" id="fuelEnd" placeholder="Bahan Bakar Akhir (L)" step="0.01" required>
                <button type="submit">Hitung</button>
            </form>
            <div id="result"></div>
        </section>

        <section id="history" class="tab-content" style="display:none;">
            <h2>Riwayat</h2>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Pemakaian (L/jam)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="chart" class="tab-content" style="display:none;">
            <h2>Grafik Pemakaian</h2>
            <canvas id="fuelChart"></canvas>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kalkulator Pemakaian Meter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container">
        <header class="main-header">
            <div class="header-content">
                <div class="header-top">
                    <span class="header-logo">⚡</span>
                    <div class="live-indicator">
                        <span class="pulse-dot"></span>
                        <span class="live-text">ONLINE</span>
                    </div>
                </div>
                <h1>Monitoring Pemakaian Meter</h1>
                <p class="header-subtitle">Panel Kontrol Shift & Kalkulasi Otomatis</p>
            </div>
        </header>
        
        <div class="card">
            <div class="quick-shifts" style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="button" class="btn-shift" onclick="setShift('07:00', '15:00')">🌅 Shift Pagi (07-15)</button>
                <button type="button" class="btn-shift" onclick="setShift('15:00', '23:00')">☀️ Shift Sore (15-23)</button>
                <button type="button" class="btn-shift" onclick="setShift('23:00', '07:00')">🌙 Shift Malam (23-07)</button>
            </div>
            <form id="meterForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Angka Meter Awal</span>
                            <span id="autoFillBadge" style="font-size: 11px; background: rgba(0,212,255,0.2); color: var(--accent); padding: 2px 6px; border-radius: 4px; display: none;">⚡ Dari Shift Sebelumnya</span>
                        </label>
                        <input type="number" id="meterStart" step="any" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label>Waktu Awal</label>
                        <input type="time" id="timeStart" required>
                    </div>
                    <div class="form-group">
                        <label>Angka Meter Akhir</label>
                        <input type="number" id="meterEnd" step="any" inputmode="decimal" required>
                    </div>
                    <div class="form-group">
                        <label>Waktu Akhir</label>
                        <input type="time" id="timeEnd" required>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary">Hitung</button>
                    <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
                </div>
            </form>
        </div>

        <div id="resultsArea" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card">Total Pemakaian: <span id="resTotal"></span></div>
                <div class="stat-card">Durasi: <span id="resDuration"></span> Jam</div>
                <div class="stat-card">Rata-rata: <span id="resAvg"></span>/jam</div>
            </div>
            
            <div class="card chart-wrapper">
                <h2>Grafik Pemakaian</h2>
                <canvas id="usageChart"></canvas>
            </div>

            <div class="card">
                <div class="table-actions">
                    <h2>Tabel Perkembangan</h2>
                    <button id="downloadBtn" class="btn-export">Download CSV</button>
                </div>
                <div class="table-container">
                    <table id="resultTable">
                        <thead>
                            <tr>
                                <th>Jam</th>
                                <th>Angka Meter</th>
                                <th>Pemakaian Jam</th>
                                <th>Kumulatif</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
